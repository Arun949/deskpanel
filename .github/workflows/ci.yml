name: ci

on:
  push:
  pull_request:

# Least privilege: CI only reads the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs (the tag in the comment is for humans).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build (warnings are errors)
        run: dotnet build DeskPanel.slnx -c Release --nologo
      - name: Test (includes the route-classification test)
        run: dotnet test DeskPanel.slnx -c Release --no-build --nologo
      - name: Smoke test the built agent on this OS (real CPU/memory on Windows and macOS)
        shell: bash
        run: |
          if command -v python >/dev/null 2>&1 && python --version >/dev/null 2>&1; then PY=python; else PY=python3; fi
          $PY tools/smoke.py

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Build the panel (packaged into the APK)
        working-directory: panel
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests and debug APK (wrapper checksum-pinned)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
