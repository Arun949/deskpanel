name: release

# Two ways in:
#   - "Run workflow" by hand (dry run): builds and smoke-tests everything and writes checksums. Nothing is signed or published.
#   - Pushing a tag vX.Y.Z (real run): the same, then the APK and the checksum file are signed, build provenance is recorded,
#     and a DRAFT release is created. Nothing is public until you review the draft and press Publish.
# See docs/RELEASING.md for the one-time key setup and docs/VERIFY.md for how users check a download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: everything reads only, except the final publish job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions in the code agree (and match the tag on a real run)
        id: v
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: echo "version=$(python3 tools/check_version.py "$TAG")" >> "$GITHUB_OUTPUT"

  agent:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64, ext: "", smoke: true }
          - { os: macos-latest, rid: osx-x64, ext: "", smoke: false } # Intel build, made on an Apple-silicon runner
          - { os: windows-latest, rid: win-x64, ext: ".exe", smoke: true }
          - { os: ubuntu-latest, rid: linux-x64, ext: "", smoke: true }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test DeskPanel.slnx -c Release --nologo
      - name: Publish one self-contained executable (no .NET install needed on the user's computer)
        shell: bash
        run: |
          dotnet publish agent/DeskPanel.Agent -c Release -r "${{ matrix.rid }}" --self-contained --nologo \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out
          mkdir dist
          cp "out/DeskPanelAgent${{ matrix.ext }}" "dist/deskpanel-agent-$VERSION-${{ matrix.rid }}${{ matrix.ext }}"
      - name: Smoke test the packaged executable on its own OS
        if: matrix.smoke
        shell: bash
        run: |
          if command -v python >/dev/null 2>&1 && python --version >/dev/null 2>&1; then PY=python; else PY=python3; fi
          $PY tools/smoke.py --exe "dist/deskpanel-agent-$VERSION-${{ matrix.rid }}${{ matrix.ext }}"
      - name: Dependency list of the agent
        if: matrix.rid == 'linux-x64'
        run: dotnet list agent/DeskPanel.Agent package --include-transitive --format json > "dist/deskpanel-agent-$VERSION-dependencies.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Test and build the panel (packaged into the APK), and its SBOM
        working-directory: panel
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          mkdir -p ../dist
          npm sbom --sbom-format cyclonedx --omit dev > "../dist/deskpanel-panel-$VERSION-sbom.cdx.json"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Put the signing key in a temporary file (real run only)
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::secret ANDROID_KEYSTORE_BASE64 is not set (docs/RELEASING.md)"; exit 1; fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DESKPANEL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests and release APK (wrapper checksum-pinned)
        working-directory: android
        env:
          DESKPANEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DESKPANEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DESKPANEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Remove the signing key
        if: always() && github.ref_type == 'tag'
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Collect the APK (signed and verified on a real run)
        run: |
          out=android/app/build/outputs/apk/release
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$apksigner" verify --verbose --print-certs "$out/app-release.apk"
            cp "$out/app-release.apk" "dist/deskpanel-$VERSION.apk"
          else
            cp "$out/app-release-unsigned.apk" "dist/deskpanel-$VERSION-unsigned.apk"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  checksums:
    needs: [version, agent, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deskpanel-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: [version, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the draft release
      id-token: write     # sign the provenance attestation
      attestations: write # store it
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deskpanel-${{ needs.version.outputs.version }}
          path: dist
      - name: Checksums still match the files
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Sign SHA256SUMS with minisign, then check it against the public key in the repo
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -f release/minisign.pub || { echo "::error::release/minisign.pub is missing (docs/RELEASING.md)"; exit 1; }
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "::error::secret MINISIGN_SECRET_KEY is not set (docs/RELEASING.md)"; exit 1; fi
          sudo apt-get install -y --no-install-recommends minisign >/dev/null
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS -t "deskpanel v$VERSION"
          rm -f "$RUNNER_TEMP/minisign.key"
          minisign -V -p release/minisign.pub -m dist/SHA256SUMS
      - name: Record build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the DRAFT release (review it, then publish by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "DeskPanel $VERSION" --generate-notes
